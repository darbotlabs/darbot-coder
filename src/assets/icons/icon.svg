<?xml version="1.0" encoding="UTF-8"?>
<svg id="darbot-coder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <style>
      .icon-fill {
        fill: #00FF66;
        stroke-width: 0px;
      }
      .icon-bg {
        fill: #1a1a1a;
        stroke-width: 0px;
      }
    </style>
  </defs>
  <!-- Background circle -->
  <circle class="icon-bg" cx="48" cy="48" r="46"/>
  <!-- Terminal window outline -->
  <rect class="icon-fill" x="16" y="20" width="64" height="48" rx="4" fill="none" stroke="#00FF66" stroke-width="2"/>
  <!-- Terminal header bar -->
  <rect class="icon-fill" x="16" y="20" width="64" height="8" rx="4"/>
  <!-- Terminal dots -->
  <circle fill="#1a1a1a" cx="22" cy="24" r="1.5"/>
  <circle fill="#1a1a1a" cx="28" cy="24" r="1.5"/>
  <circle fill="#1a1a1a" cx="34" cy="24" r="1.5"/>
  <!-- Code/prompt symbol -->
  <text class="icon-fill" x="20" y="44" font-family="monospace" font-size="12" fill="#00FF66">></text>
  <text class="icon-fill" x="28" y="44" font-family="monospace" font-size="8" fill="#00FF66">_</text>
  <!-- Ghost/bot elements -->
  <circle class="icon-fill" cx="48" cy="78" r="8"/>
  <path class="icon-fill" d="M42,78 Q42,74 46,74 L50,74 Q54,74 54,78 L54,84 L51,81 L48,84 L45,81 L42,84 Z"/>
</svg>
