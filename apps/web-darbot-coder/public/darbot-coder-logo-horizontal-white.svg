<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <style>
      .logo-text { fill: #ffffff; font-family: 'Courier New', monospace; font-weight: bold; }
      .logo-icon { fill: #ffffff; stroke: #ffffff; }
      .terminal-bg { fill: none; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Terminal icon -->
  <rect class="terminal-bg" x="10" y="20" width="60" height="40" rx="4"/>
  <rect class="logo-icon" x="10" y="20" width="60" height="8" rx="4"/>
  <circle fill="#000000" cx="18" cy="24" r="1.5"/>
  <circle fill="#000000" cx="24" cy="24" r="1.5"/>
  <circle fill="#000000" cx="30" cy="24" r="1.5"/>
  <text class="logo-icon" x="16" y="42" font-family="monospace" font-size="10">></text>
  <text class="logo-icon" x="24" y="42" font-family="monospace" font-size="8">_</text>
  
  <!-- Ghost/bot -->
  <circle class="logo-icon" cx="40" cy="70" r="6"/>
  <path class="logo-icon" d="M35,70 Q35,67 38,67 L42,67 Q45,67 45,70 L45,75 L42,73 L40,75 L38,73 L35,75 Z"/>
  
  <!-- Text -->
  <text class="logo-text" x="85" y="35" font-size="18">DARBOT</text>
